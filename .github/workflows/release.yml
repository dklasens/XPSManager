name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: windows-2025
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Validate release version
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Version must have three numeric parts.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'Tag and Directory.Build.props version must agree.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Restore and audit dependencies
        run: |
          dotnet restore XpsManager.slnx --force-evaluate -p:NuGetAudit=true
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet restore tools/TelemetryChecks --force-evaluate -p:NuGetAudit=true
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build and run checks
        run: |
          dotnet build XpsManager.slnx -c Release --no-restore -warnaserror
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project tools/TelemetryChecks -c Release --no-restore
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build installer upgrade fixture
        run: |
          ./tools/Build-Installer.ps1 -Version 0.0.1
          Copy-Item installer/bin/Release/XpsManager-0.0.1-win-x64.msi artifacts/upgrade-fixture.msi
      - name: Build release installer
        run: ./tools/Build-Installer.ps1 -Version $env:RELEASE_VERSION
      - name: Inspect installer package
        run: ./tools/Test-InstallerPackage.ps1 -Msi "installer/bin/Release/XpsManager-$env:RELEASE_VERSION-win-x64.msi" -Version $env:RELEASE_VERSION
      - name: Check installation, repair, upgrade, downgrade and uninstall
        run: ./tools/Test-Installer.ps1 -Msi "installer/bin/Release/XpsManager-$env:RELEASE_VERSION-win-x64.msi" -OlderMsi artifacts/upgrade-fixture.msi
      - name: Package MSI and ZIP
        shell: pwsh
        run: ./tools/Package-Release.ps1 -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-package
          path: artifacts/release/
          if-no-files-found: error
      - name: Keep installer test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-test-logs
          path: artifacts/installer-tests/*.log
          if-no-files-found: ignore

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-package
          path: release
      - name: Publish release with verified downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release
          sha256sum --check SHA256SUMS.txt
          gh release create "$RELEASE_TAG" ./*.msi ./*.zip SHA256SUMS.txt build-info.json \
            --verify-tag --draft --title "XPS Manager $RELEASE_TAG" --notes-file RELEASE-NOTES.md
          gh release edit "$RELEASE_TAG" --draft=false --latest
